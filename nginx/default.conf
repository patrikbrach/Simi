server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name simi.brach.se;

    ssl_certificate     /etc/letsencrypt/live/simi.brach.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simi.brach.se/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # SSE: disable proxy buffering for progress streams
    proxy_buffering off;
    proxy_cache     off;

    # API
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 360s;

        # SSE support
        proxy_set_header   Connection '';
        chunked_transfer_encoding on;
    }

    # SPA static files
    location / {
        root  /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}
